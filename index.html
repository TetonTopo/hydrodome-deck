<!doctype html>
<html lang="en" class="pending">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>The Moat</title>
<style>@font-face{font-family:"Barlow Semi Condensed";font-weight:700;font-style:normal;font-display:swap;src:url(assets/fonts/BarlowSemiCondensed-Bold.ttf) format("truetype")}@font-face{font-family:"Barlow Semi Condensed";font-weight:600;font-style:normal;font-display:swap;src:url(assets/fonts/BarlowSemiCondensed-SemiBold.ttf) format("truetype")}@font-face{font-family:"Barlow Semi Condensed";font-weight:500;font-style:normal;font-display:swap;src:url(assets/fonts/BarlowSemiCondensed-Medium.ttf) format("truetype")}@font-face{font-family:"IBM Plex Mono";font-weight:500;font-style:normal;font-display:swap;src:url(assets/fonts/IBMPlexMono-Medium.ttf) format("truetype")}
:root{--bg:#121212;--panel:#1a1b1d;--panel2:#212326;--grey:#434549;--flame:#ba4100;--flame-text:#f08a4b;--fg:#ece8e2;--muted:#a9a59e;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font:500 16px/1.5 "Barlow Semi Condensed",system-ui,sans-serif;min-height:100vh}
.pending #gate{visibility:hidden}
#gate{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 16px;gap:28px}
#logo{display:block;width:min(340px,78vw);height:auto}
#gate form{width:min(360px,100%);display:flex;flex-direction:column;gap:10px}
.lbl{font:500 12px/1.4 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
#pw{width:100%;font:500 17px/1.2 "IBM Plex Mono",ui-monospace,monospace;color:var(--fg);background:var(--panel);border:1px solid var(--grey);border-radius:4px;padding:12px 14px}
#pw:focus{outline:2px solid var(--flame);outline-offset:1px;border-color:var(--flame)}
#go{font:700 16px/1 "Barlow Semi Condensed",system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:var(--flame);border:0;border-radius:4px;padding:14px;cursor:pointer}
#go:hover{filter:brightness(1.12)}#go:disabled{opacity:.6;cursor:wait}
#err{margin:2px 0 0;color:var(--flame-text);font:500 14px/1.4 "IBM Plex Mono",ui-monospace,monospace;min-height:1.4em}
noscript p{color:var(--flame-text);text-align:center}
.hub{max-width:1120px;margin:0 auto;padding:28px 16px 40px}
.hub-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px 24px;padding-bottom:22px;border-bottom:1px solid var(--grey)}
.hub-head #logo{width:min(220px,60vw)}
.hub-meta{display:flex;align-items:center;gap:18px}
.kicker{margin:0;font:500 12px/1.4 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--flame-text)}
.lock{font:500 12px/1 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-decoration:none;border:1px solid var(--grey);border-radius:3px;padding:7px 10px}
.lock:hover,.lock:focus-visible{color:var(--fg);border-color:var(--flame)}
.intro{margin:28px 0 22px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.lead{margin:0;font:700 clamp(24px,3.6vw,36px)/1.1 "Barlow Semi Condensed",system-ui,sans-serif;text-transform:uppercase;letter-spacing:.01em}
.cards{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.card{display:flex;flex-direction:column;height:100%;background:var(--panel);border:1px solid #2a2c30;border-radius:6px;overflow:hidden;color:var(--fg);text-decoration:none;transition:border-color .15s,transform .15s}
.card:hover,.card:focus-visible{border-color:var(--flame);transform:translateY(-2px)}
.card:focus-visible{outline:2px solid var(--flame);outline-offset:2px}
.thumb{aspect-ratio:16/9;background:var(--panel2);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.body{display:flex;flex-direction:column;gap:6px;padding:16px 18px 18px;flex:1;background:linear-gradient(var(--panel),var(--panel2))}
.body h2{margin:0;font:700 22px/1.1 "Barlow Semi Condensed",system-ui,sans-serif;text-transform:uppercase;letter-spacing:.01em}
.body p{margin:0;color:var(--muted);font-size:16px;flex:1}
.open{margin-top:8px;font:500 13px/1 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--flame-text)}
.card:hover .open{color:var(--fg)}
.card.soon{cursor:default}.card.soon:hover{border-color:#2a2c30;transform:none}.card.soon .thumb img{opacity:.45}.card.soon .open{color:var(--muted)}
.foot{margin-top:36px;padding-top:18px;border-top:1px solid var(--grey);font:500 12px/1.6 "IBM Plex Mono",ui-monospace,monospace;color:var(--muted)}
.foot a{color:var(--muted)}
@media (max-width:480px){.cards{grid-template-columns:1fr}.hub-meta{width:100%;justify-content:space-between}}
</style>
</head>

<script>(()=>{
const $=id=>document.getElementById(id);
const cfg=JSON.parse($('cfg').textContent);
const SK='moat-key:'+cfg.salt;
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const toB64=u=>{let s='';for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)};
const store={get(){try{return sessionStorage.getItem(SK)}catch(e){return null}},set(v){try{sessionStorage.setItem(SK,v)}catch(e){}},
  clear(){try{Object.keys(sessionStorage).forEach(k=>{if(k.indexOf('moat-key:')===0)sessionStorage.removeItem(k)})}catch(e){}}};
async function derive(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw.normalize('NFC')),'PBKDF2',false,['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:b64(cfg.salt),iterations:cfg.iter},base,256));
}
async function decrypt(raw){
  const key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
  const buf=b64($('payload').textContent.trim());
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:buf.subarray(0,12)},key,buf.subarray(12));
  return await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
}
function show(html){
  if(cfg.mode==='deck'){document.open();document.write(html);document.close();return;}
  const logo=$('logo');$('gate').remove();
  const app=$('app');app.innerHTML=html;
  const slot=app.querySelector('[data-logo]');if(slot&&logo)slot.replaceWith(logo);
  document.documentElement.classList.remove('pending');
}
document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('[data-lock]');if(a){e.preventDefault();store.clear();location.reload();}});
function gate(){
  document.documentElement.classList.remove('pending');
  const f=$('unlock'),pw=$('pw'),go=$('go'),err=$('err');
  pw.focus();
  f.addEventListener('submit',async e=>{
    e.preventDefault();if(!pw.value)return;
    go.disabled=true;go.textContent='Unlocking\u2026';err.textContent='';
    let html=null,raw=null;
    try{raw=await derive(pw.value);html=await decrypt(raw);}catch(x){html=null;}
    if(html===null){err.textContent="That password didn't work. Try again.";go.disabled=false;go.textContent='Unlock';pw.select();return;}
    store.set(toB64(raw));pw.value='';show(html);
  });
}
(async()=>{
  const k=store.get();
  if(k){try{show(await decrypt(b64(k)));return;}catch(x){store.clear();}}
  gate();
})();
})();</script>
